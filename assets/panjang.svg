<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="panSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="60%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
  </defs>
  <!-- Hazy Sky -->
  <rect width="600" height="300" fill="url(#panSky)"/>
  <ellipse cx="280" cy="90" rx="90" ry="25" fill="#eceff1" opacity="0.4"/>
  <ellipse cx="440" cy="110" rx="120" ry="30" fill="#eceff1" opacity="0.3"/>
  <!-- Sea / Bay -->
  <rect y="220" width="600" height="80" fill="url(#seaGrad)"/>
  <!-- Industrial Silhouettes -->
  <!-- Silos -->
  <rect x="50" y="160" width="45" height="65" fill="#546e7a" rx="4"/>
  <ellipse cx="72.5" cy="160" rx="22.5" ry="8" fill="#78909c"/>
  <rect x="105" y="150" width="55" height="75" fill="#455a64" rx="4"/>
  <ellipse cx="132.5" cy="150" rx="27.5" ry="9" fill="#607d8b"/>
  <!-- Factory Stacks -->
  <polygon points="190,140 198,140 200,220 188,220" fill="#37474f"/>
  <polygon points="215,130 223,130 226,220 212,220" fill="#263238"/>
  <ellipse cx="219" cy="122" rx="12" ry="7" fill="#eceff1" opacity="0.6"/>
  <ellipse cx="225" cy="112" rx="18" ry="9" fill="#eceff1" opacity="0.4"/>
  <!-- Port Cranes (Gantry Cranes) -->
  <g stroke="#d32f2f" stroke-width="3" fill="none">
    <line x1="340" y1="220" x2="355" y2="140"/>
    <line x1="380" y1="220" x2="365" y2="140"/>
    <line x1="330" y1="140" x2="430" y2="140"/>
    <line x1="360" y1="140" x2="360" y2="110"/>
    <line x1="330" y1="140" x2="360" y2="110"/>
    <line x1="430" y1="140" x2="360" y2="110"/>
    <!-- Second Crane -->
    <line x1="450" y1="220" x2="465" y2="150"/>
    <line x1="490" y1="220" x2="475" y2="150"/>
    <line x1="440" y1="150" x2="530" y2="150"/>
  </g>
  <!-- Cargo Ship in water -->
  <polygon points="410,240 560,240 540,265 425,265" fill="#212121"/>
  <rect x="470" y="222" width="50" height="18" fill="#c62828"/>
  <rect x="430" y="230" width="30" height="10" fill="#ffb300"/>
</svg>

